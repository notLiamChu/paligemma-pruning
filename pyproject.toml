[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paligemma-pruning"
version = "0.1.0"
description = "AGOP Physical Channel Pruning and Distillation for PaliGemma 2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
{ name = "Research Team" }
]
dependencies = [
"torch>=2.2.0",
"torchvision>=0.17.0",
"transformers>=4.46.0",
"accelerate>=0.30.0",
"huggingface-hub>=0.23.0",
"tqdm>=4.66.0",
"pyyaml>=6.0.1",
"numpy>=1.24.0",
"scipy>=1.10.0",
"pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0.0",
"black>=24.0.0",
"ruff>=0.4.0",
]
eval = [
"torchmetrics>=1.3.0",
"matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "models*", "data*", "metrics*", "tools*"]
