experiment:
  name: "exp1_siglip_vision_pruning"
  description: "Structured AGOP physical channel pruning on SigLIP vision tower MLPs"

model:
  model_id: "google/paligemma2-3b-pt-224"
  dtype: "bfloat16"
  device: "cuda"

pruning:
  target_components: "vision"
  target_layers: null
  energy_threshold: 0.85
  eigen_coordinate_sigma: 0.95
  agop_samples: 64
  score_mode: "nll_loss"

distillation:
  epochs: 3
  learning_rate: 2.0e-5
  weight_decay: 0.01
  alpha: 0.5
  temperature: 2.0
  max_grad_norm: 1.0

data:
  batch_size: 2
  max_length: 512
  image_size: 224

output:
  checkpoint_dir: "checkpoints/exp1_vision_pruned"
